version: "3.8"

services:
  curtain-gateway:
    build: .
    container_name: curtain-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env

  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  mosquitto-data:
  mosquitto-log:
